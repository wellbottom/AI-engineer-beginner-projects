# Nginx config that serves the built Vite + React SPA (Shared_Frontend).
#
# The SPA uses client-side routing (Requirement 2.3), so every non-asset path
# must fall back to /index.html (try_files ... /index.html) — otherwise a deep
# link or refresh on a client-side route would 404. Static assets are served
# directly with long-lived caching; index.html is never cached so a new build is
# picked up immediately.
#
# This file lives inside the frontend build context. Task 16 relocates the
# frontend to ./apps/web; this file moves with it (apps/web/nginx.conf) and the
# Dockerfile COPY path stays "nginx.conf" (relative to the context).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed build assets (immutable) — cache aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes: serve index.html for anything not a real file.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
