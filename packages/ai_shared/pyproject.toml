[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_shared"
version = "0.1.0"
description = "Shared backend layer (config, errors, LLM client, SSE, persistence) for the AI Engineer Practice Monorepo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineer Practice Monorepo" }]
dependencies = [
    # Minimal runtime deps for the Task 2 config + errors layer.
    "python-dotenv>=1.0",
    # Task 3: OpenAI-compatible LLM client (points at the local gateway).
    # Isolated behind a lazy import in ai_shared.llm_client so the pure logic
    # (resolve_model, SSE formatting, stream-event handling) stays testable
    # without a live client.
    "openai>=1.40",
    # Task 4: shared persistence layer (History_Store). SQLAlchemy 2.x ORM +
    # psycopg v3 driver (the bundled-binary extra ships a self-contained wheel,
    # avoiding a local libpq/build toolchain) and Alembic for the shared
    # migration history. All resolved native cp314 wheels on Python 3.14
    # (see development/buglists.md BUG-002).
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    # Task 5: provider wrappers (Requirements 6.1, 6.6, 7.2, 7.3, 7.7).
    # Each third-party SDK is isolated behind a lazy import in its wrapper
    # (ai_shared.search / embeddings / vectorstore) and the client is injectable,
    # so the wrappers' normalization/timeout/error-mapping logic stays testable
    # without these libraries installed.
    #   - tavily-python: Tavily web search wrapper.
    #   - huggingface_hub: HF inference embeddings (and image generation, Task 11).
    #   - chromadb: local persistent vector store.
    # All resolved native cp314 wheels on Python 3.14 with NO source build
    # (chromadb pulled onnxruntime/tokenizers/grpcio/numpy as prebuilt wheels) —
    # see development/buglists.md BUG-002 (Task 5 update).
    "tavily-python>=0.5",
    "huggingface_hub>=0.23",
    "chromadb>=0.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
