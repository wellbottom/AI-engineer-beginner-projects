# Alembic configuration for the shared History_Store schema.
#
# This is the single shared migration history for every mini-project's history
# tables (Requirements 12.2, 12.3). The database URL is NOT hardcoded here — it is
# resolved at runtime in migrations/env.py from ai_shared.config.Settings (the root
# .env DB_* variables), so migrations use the same connection approach as the
# services. Run `alembic upgrade head` (from packages/ai_shared) before serving.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = migrations

# Template used to generate migration file names; date-prefixed for ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use os.pathsep at the end of sys.path entries.
prepend_sys_path = .

# Timezone for timestamps in migration filenames (UTC).
timezone = UTC

# sqlalchemy.url is intentionally left blank: env.py supplies it from Settings.
sqlalchemy.url =

[post_write_hooks]
# (none configured)

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
